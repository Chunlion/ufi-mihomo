name: Release assets

# Re-pack an existing release from the repository state instead of uploading 64 MB from a
# contributor's uplink: the component package only ever travels GitHub to GitHub here.
# The package itself is no longer committed, so this job rebuilds it from the last release asset.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to fill
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache-dependency-path: gist-sync/native/go.sum
      - name: Build the component package
        run: python3 scripts/build_gist_sync.py
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "$(ls *TProxy.js)#TProxy.js" tproxy-yq.zip --clobber
